name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build portable app
        run: python tools/build.py --release
      - name: Check packaged launch and exit
        shell: pwsh
        run: |
          $process = Start-Process dist/release/AdaptiveVolume/AdaptiveVolume.exe -ArgumentList '--smoke' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed' }
          $marker = Get-Content dist/release/AdaptiveVolume/data/packaged-smoke.json -Raw | ConvertFrom-Json
          if (-not $marker.event_loop_completed -or -not $marker.native_windows_destroyed) { throw 'GUI cleanup was not completed' }
      - name: Package and checksum
        run: python tools/package_zip.py --release
      - uses: actions/upload-artifact@v7
        with:
          name: AdaptiveVolume-windows-x64
          path: |
            dist/AdaptiveVolume-*-windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 14
