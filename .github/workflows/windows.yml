name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build portable app
        run: python tools/build.py --release
      - name: Check packaged launch and exit
        run: python tools/test_packaged_window.py
      - name: Package and checksum
        run: python tools/package_zip.py --release
      - uses: actions/upload-artifact@v7
        with:
          name: AdaptiveVolume-windows-x64
          path: |
            dist/AdaptiveVolume-*-windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 14
